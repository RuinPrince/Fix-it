version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: fixit-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-fixitroot2025}
      MYSQL_DATABASE: ${DB_NAME:-fixit_db}
      MYSQL_USER: ${DB_USER:-fixit_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fixit_pass_2025}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fixit-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: fixit-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fixit-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fixit-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-fixit_db}
      DB_USER: ${DB_USER:-fixit_user}
      DB_PASSWORD: ${DB_PASSWORD:-fixit_pass_2025}
      JWT_SECRET: ${JWT_SECRET:-fixit-jwt-secret-2025-production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    networks:
      - fixit-network
    restart: unless-stopped

  # Admin Dashboard (build)
  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: fixit-dashboard
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - fixit-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: fixit-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - admin-dashboard
    networks:
      - fixit-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  backend_uploads:
  backend_logs:

networks:
  fixit-network:
    driver: bridge
