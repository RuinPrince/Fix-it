# =============================================================================
# Fix It — Development Nginx Configuration
# =============================================================================
# Simpler config for local development:
#   - No SSL (plain HTTP only)
#   - Relaxed rate limiting
#   - Permissive CORS
#   - Debug-friendly logging
# =============================================================================

worker_processes 1;

error_log /var/log/nginx/error.log debug;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format dev '$remote_addr [$time_local] "$request" $status '
                   '$body_bytes_sent rt=$request_time';

    access_log /var/log/nginx/access.log dev;

    sendfile    on;
    tcp_nopush  on;

    keepalive_timeout 65;
    client_max_body_size 50m;

    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    limit_req_zone $binary_remote_addr zone=dev_limit:5m rate=50r/s;

    upstream backend_api {
        server backend:5000;
    }

    upstream admin_dashboard {
        server admin-dashboard:3000;
    }

    server {
        listen 80;
        server_name localhost;

        location /health {
            access_log off;
            return 200 '{"status":"ok","env":"development"}';
            add_header Content-Type application/json;
        }

        location /api/ {
            limit_req zone=dev_limit burst=100 nodelay;

            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        location /socket.io/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering    off;
        }

        location / {
            proxy_pass         http://admin_dashboard;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";

            add_header Cache-Control "no-store";

            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }
    }
}
